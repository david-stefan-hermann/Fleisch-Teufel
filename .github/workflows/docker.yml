name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/fleisch-teufel
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
      - id: version
        run: echo "value=$(node -p "require('./package.json').version")+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          docker network create ft
          docker run -d --name db --network ft -e POSTGRES_PASSWORD=pw -e POSTGRES_USER=ft -e POSTGRES_DB=ft postgres:17-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U ft -d ft && break; sleep 1; done
          docker run -d --name app --network ft -p 3000:3000 -e DATABASE_URL=postgres://ft:pw@db:5432/ft ghcr.io/${{ github.repository_owner }}/fleisch-teufel:sha-${GITHUB_SHA::7}
          for i in $(seq 1 60); do curl -sf localhost:3000/health && break; sleep 2; done
          curl -sf localhost:3000/health
          curl -sf localhost:3000/ | grep -q Fleisch-Teufel
          curl -sf localhost:3000/api/info
        shell: bash
      - if: failure()
        run: docker logs app || true
