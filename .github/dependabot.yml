# Weekly dependency updates, bundled: minor and patch versions in one PR per ecosystem, majors one PR each.
# Every PR runs CI; nothing is published before it is merged into main (see workflows/docker.yml).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
